<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Todo app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 11px;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet">
  <script type="module" crossorigin src="/todo-list/assets/index-C00u6ceZ.js"></script>
  <link rel="stylesheet" crossorigin href="/todo-list/assets/index-BUNeaOxu.css">
</head>

<body>
  <main class="container">
    <!-- Header -->
    <header class="header">
      <h1 class="title">TODO</h1>
      <button class="theme-toggle" aria-label="Toggle Theme">
        <img class="theme-toggle--image" src="/todo-list/images/icon-sun.svg" alt="sun theme">
      </button>
    </header>


    <!-- Input -->
    <section class="todo-input">
      <form id="todo-form">
        <input type="text" id="todo-text" class="form-input" placeholder="Currently typing..."
          aria-label="Add a new todo">
          <button class="todo-btn" type="button" >
            <img src="/todo-list/images/icons8-add-button-64.png" alt="plus button">
          </button>
      </form>
    </section>

    <!-- Todo List -->
    <section class="todo-container">
      <div class="todos">
        <ul class="todo-list">
        
        </ul>

        <!-- Footer / Filters -->
        <footer class="todo-footer">
          <span class="items-left"> <span class="items-left--num"></span> items left</span>
          <div class="filters">
            <button class="filter all active">All</button>
            <button class="filter unCompleted">Active</button>
            <button class="filter completed">Completed</button>
          </div>
          <button class="clear-btn">Clear Completed</button>
        </footer>


    </section>
    </div>



    <p class="drag-drop-hint">Drag and drop to reorder list</p>
  </main>
</body>


</html>
